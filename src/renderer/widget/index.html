<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Claude Buddy</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    body {
      -webkit-app-region: drag;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* Top padding leaves room for the speech bubble above the mascot's head. */
    body { padding-top: 34px; box-sizing: border-box; }
    #scene { width: 220px; height: 220px; display: block; }
    #bubble {
      position: absolute;
      top: 4px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      max-width: 196px;
      pointer-events: none;
      animation: bob 1.6s ease-in-out infinite;
    }
    #bubble .pop {
      position: relative;
      padding: 6px 10px;
      border-radius: 12px;
      background: #fffdf8;
      color: #1b1b1f;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transform-origin: 50% 110%;
      transform: scale(0);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
    }
    #bubble.show .pop { transform: scale(1); opacity: 1; }
    /* Tail pointing down at the head. */
    #bubble .pop::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      margin-left: -6px;
      border: 6px solid transparent;
      border-bottom: 0;
      border-top-color: #fffdf8;
    }
    #bubble-rest { visibility: hidden; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    /* No-drag so right-clicks reach the page. */
    #label {
      -webkit-app-region: no-drag;
      cursor: default;
      margin-top: 2px;
      padding: 5px 12px;
      border-radius: 14px;
      border: 2px solid var(--ring, #5BC98A);
      background: rgba(24, 24, 27, 0.82);
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      box-sizing: border-box;
      max-width: 170px; /* long labels wrap instead of being cut */
    }
    #bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px; max-width: 214px; }
    #bar #label { margin-top: 0; }
    #settings-btn {
      -webkit-app-region: no-drag;
      position: relative;
      flex: none;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #52525b;
      background: rgba(24, 24, 27, 0.82);
      color: #e4e4e7;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    #settings-btn:hover { border-color: #a1a1aa; }
    /* LED connection dot (hidden when disconnected). */
    #settings-btn::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--led-dot, transparent);
    }
    #label.needs_input { animation: nudge 0.9s ease-in-out infinite; }
    @keyframes nudge {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.0); }
      50%      { transform: scale(1.06); box-shadow: 0 0 12px 2px rgba(255, 77, 77, 0.7); }
    }
  </style>
</head>
<body>
  <div id="bubble"><div class="pop"><span id="bubble-typed"></span><span id="bubble-rest"></span></div></div>
  <canvas id="scene" width="220" height="220"></canvas>
  <div id="bar">
    <div id="label" title="Right-click for options">Idle</div>
    <button id="settings-btn" title="Settings">⚙</button>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
